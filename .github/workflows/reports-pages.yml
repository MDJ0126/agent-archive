name: Publish report archive
on:
  push:
    branches: [main]
    paths: ['AGENTS.md', '리포트/**', '.github/workflows/reports-pages.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: report-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node 리포트/build.mjs
      - run: node 리포트/verify.mjs
      - run: node 리포트/verify-migration.mjs
      - run: node 리포트/verify-editorial.mjs
      - run: node --test 리포트/tests/*.test.mjs
      - run: node 리포트/package-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: 리포트/.site
          name: report-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const {default: deployPages} = await import(`${process.env.GITHUB_WORKSPACE}/리포트/deploy-pages.mjs`);
            await deployPages({github, core, context, artifactId: process.env.PAGES_ARTIFACT_ID});
      - name: Verify public reports and assets
        run: node 리포트/verify-public.mjs
